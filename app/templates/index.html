<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Movie Catalog</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=19">
</head>
<body>
    <div class="top-bar">
        <div class="brand">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="3" width="20" height="18" rx="3" stroke="#7a1f2c" stroke-width="1.6"/>
                <path d="M2 8h20M7 3v5M17 3v5" stroke="#7a1f2c" stroke-width="1.6"/>
            </svg>
            <h1>My Movie Catalog</h1>
        </div>

        <div class="toolbar">
            <form id="search-title-form" class="search-form">
                <button type="submit" class="search-submit-btn" aria-label="Search">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                        <circle cx="11" cy="11" r="7" stroke="#8a8a8a" stroke-width="2"/>
                        <path d="M21 21l-4.3-4.3" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <input type="text" id="search-title" name="search-title" maxlength="100" placeholder="Search by title">
                <button type="reset" class="search-clear-btn" form="search-title-form">Clear</button>
            </form>

            <label class="select-all-control">
                <input type="checkbox" id="select-all-cb" onclick="toggleSelectAll(this)">
                Select all
            </label>

            <div class="sort-control">
                <select id="sort-select" onchange="onSortChange()">
                    <option value="">Sort by</option>
                    <option value="title">Title</option>
                    <option value="year">Year</option>
                    <option value="rating">Rating</option>
                </select>
                <button type="button" id="sort-direction-btn" class="sort-direction-btn" onclick="toggleSortDirection()" title="Toggle sort direction">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M6 13l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>

            <a href="/catalog" class="btn-primary" style="text-decoration:none">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#fff" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
                Browse
            </a>

            <button type="button" class="btn-primary" onclick="openMovieInputWindow()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
                Add Movie
            </button>

            {% if profile %}
            <div class="account">
                <span class="avatar">{{ profile.display_name[0] }}</span>
                <span class="who">{{ profile.display_name }}</span>
                <form method="post" action="/logout"><button type="submit">Sign out</button></form>
            </div>
            {% endif %}
        </div>
    </div>

    <!-- Cards are built only by renderMovieCard() in app.js, from the
         #bootstrap-movies payload below. A second copy of this markup lived
         here and drifted from the JS one as soon as a feature touched it. -->
    <div id="movie-grid" class="poster-grid"></div>

    <div id="bulk-bar" class="bulk-bar">
        <span id="bulk-bar-count">0 selected</span>
        <button type="button" onclick="deleteSelectedMovies()">Delete</button>
    </div>

    <!-- Custom confirm modal -->
    <div id="confirm-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal-header">
                <span id="modal-title">Confirm Deletion</span>
            </div>
            <div class="modal-body">
                <p id="modal-message"></p>
            </div>
            <div class="modal-footer">
                <button id="modal-cancel-btn" class="modal-btn modal-btn-cancel">Cancel</button>
                <button id="modal-ok-btn" class="modal-btn modal-btn-ok">OK</button>
            </div>
        </div>
    </div>

    <!-- Rating modal -->
    <div id="rating-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="rating-modal-title">
        <div class="modal">
            <div class="modal-header">
                <span id="rating-modal-title">Rate</span>
            </div>
            <div class="modal-body">
                <form id="rating-form" onsubmit="return false">
                    <label for="rating-input">Rating (0-10)</label>
                    <input type="number" id="rating-input" min="0" max="10" step="0.1" required>

                    <label for="review-input">Review <span class="label-hint">optional</span></label>
                    <textarea id="review-input" rows="5" maxlength="5000"
                              placeholder="What did you make of it?"></textarea>
                    <label for="tags-input">Mood tags <span class="label-hint">comma separated</span></label>
                    <input type="text" id="tags-input" placeholder="cosy, rainy day, comfort watch">
                    <div id="tag-suggestions" class="tag-suggestions"></div>

                    <p class="field-hint">Ctrl+Enter saves.</p>
                </form>
                <p id="rating-error" class="modal-error" role="alert" hidden></p>
            </div>
            <div class="modal-footer">
                <button id="rating-cancel-btn" class="modal-btn modal-btn-cancel">Cancel</button>
                <button id="rating-save-btn" class="modal-btn modal-btn-ok">Save</button>
            </div>
        </div>
    </div>

    <script id="bootstrap-movies" type="application/json">{{ movies_json | tojson }}</script>
    <script src="{{ url_for('static', path='app.js') }}?v=17"></script>
</body>

</html>
